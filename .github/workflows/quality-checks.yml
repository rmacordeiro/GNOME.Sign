name: Quality checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check tests src/path_utils.py src/template_ops.py
      - name: Format check
        run: ruff format --check tests src/path_utils.py src/template_ops.py
      - name: Run tests
        run: pytest
