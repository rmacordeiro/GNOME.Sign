name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-secret-1 gir1.2-glib-2.0 appstream desktop-file-utils libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest ruff mypy pip-audit PyGObject
      - name: Lockfile consistency
        run: python scripts/sync-deps.py --check
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net io.github.ppgllrd.GNOME-Sign.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate *.desktop
