name: gnome-sign
base: core26  # Updated to Ubuntu 26.04 base
version: '1.0.0'
summary: Sign PDF documents with digital certificates
description: |
  GNOME-Sign is a GTK4/libadwaita desktop application for viewing,
  validating and digitally signing PDF files with PKCS#12 certificates.
license: AGPL-3.0-or-later
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  gnome-sign:
    command: usr/bin/gnomesign
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - gsettings
      - home
      - network
      - opengl
      - password-manager-service
      - removable-media
      - wayland
      - x11

parts:
  # 1. Added the mandatory Python runtime environment for core26
  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal       # Creates the 'python3' symlink
      - python3.14-minimal
      - python3.14-venv

  # 2. Updated application part
  gnome-sign:
    after: [python-runtime]  # Ensures the python environment builds first
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
    build-packages:
      - meson
      - ninja-build
      - pkg-config
      - python3
    # System non-python libraries 
    stage-packages:
      - gir1.2-adw-1
      - gir1.2-gtk-4.0
      - gir1.2-secret-1
      - libadwaita-1-0
      - libsecret-1-0
    # Python application dependencies downloaded directly from PyPI
    python-packages:
      - certifi
      - cffi
      - cryptography
      - PyGObject             # Replaces python3-gi & python3-gi-cairo
      - idna
      - lxml
      - oscrypto
      - pyhanko
      - pyhanko-certvalidator
      - pymupdf               # Resolves the python3-pymupdf missing error
      - requests
      - tzlocal
      - urllib3
      - pyyaml                # Replaces python3-yaml
